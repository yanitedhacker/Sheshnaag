[tool.ruff]
# Project Sheshnaag — backend lint/format configuration.
# Introduced as the quality foundation for the V5 milestone. See .git-blame-ignore-revs.
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]
extend-exclude = [
    "app/migrations/versions",  # Alembic autogenerated revisions
    "frontend",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
]
ignore = [
    "B008",  # function-call-in-default-argument — required by FastAPI Depends()/Query()
    "E402",  # module-import-not-at-top — used intentionally after sys.path / env setup
    "E741",  # ambiguous-variable-name — too noisy to enforce retroactively
    "E501",  # line-too-long — formatter handles wrapping; don't fail on long strings/URLs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]            # re-exports are intentional in package roots
"tests/**" = ["F401", "F811", "B"]  # fixtures/redefs/asserts are test idioms
"scripts/**" = ["E402"]             # smoke scripts set up sys.path before imports

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
